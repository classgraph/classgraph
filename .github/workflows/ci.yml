name: Java CI

on:
  pull_request:
    branches:
      - main
      - v4
  push:
    branches:
      - main
      - v4

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        java: [ '8', '11', '13', '15', '16', '17', '18', '19' ]
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: ${{ matrix.java }}
        # Cache ~/.m2/repository and (as a separate entry, keyed on
        # .mvn/wrapper/maven-wrapper.properties) ~/.m2/wrapper/dists, so that the Maven
        # distribution and the dependencies are not re-downloaded by all 24 matrix jobs on
        # every run. repo.maven.apache.org rate-limits (HTTP 429), which has failed builds.
        cache: 'maven'
    - name: print Java version
      run: java -version
    - name: Build with Maven
      run: ./mvnw --no-transfer-progress -B clean test

  # The Javadoc gate only runs in the package phase, which the build job above does not
  # reach. JDK 8 is the JDK releases are built with, and JDK 19 is the newest the enforcer
  # allows; doclint reports different things on either side of JDK 9, so check both ends.
  javadoc:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '8', '19' ]
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: ${{ matrix.java }}
        cache: 'maven'
    - name: print Java version
      run: java -version
    - name: Check Javadoc with Maven
      run: ./mvnw --no-transfer-progress -B clean package -DskipTests
