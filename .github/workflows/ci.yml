name: Java CI

on:
  pull_request:
    branches:
      - main
      - v5
  push:
    branches:
      - main
      - v5

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        java: [ '17', '18', '19', '20', '21', '22', '23', '24', '25' ]
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: ${{ matrix.java }}
        # Cache ~/.m2/repository and (as a separate entry, keyed on
        # .mvn/wrapper/maven-wrapper.properties) ~/.m2/wrapper/dists, so that the Maven
        # distribution and the dependencies are not re-downloaded by all 27 matrix jobs on
        # every run. repo.maven.apache.org rate-limits (HTTP 429), which has failed builds.
        cache: 'maven'
    - name: print Java version
      run: java -version
    - name: Build with Maven
      run: ./mvnw --no-transfer-progress -B clean test

  # Javadoc is checked once, rather than by all 27 matrix jobs, and under JDK 17, which is the JDK
  # the release is built with. doclint is configured to fail the build on a warning, so this job
  # goes red for a missing @param or a broken {@link}. "package" is what builds the Javadoc jars
  # that the release publishes, so this checks the same Javadoc run that a release would; the
  # modules have to be compiled first in any case, since Javadoc reads the module descriptors.
  # javadoc:aggregate then covers all five modules in one run, which is the only place the
  # cross-module links resolve, so it is what the documentation site should serve.
  javadoc:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'maven'
    - name: Check Javadoc
      run: ./mvnw --no-transfer-progress -B clean package -DskipTests javadoc:aggregate
