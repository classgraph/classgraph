name: Benchmarks

permissions:
  contents: read

# Runs the classgraph-vfs benchmarks (see RunBenchmarks) on each OS, to compare the libraries on
# each. GitHub-hosted runners share their hardware, so compare the libraries within one run, not
# one run with another. Run by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      quick:
        description: 'Run every combination once, briefly, to check that they work'
        type: boolean
        default: false
      libraries:
        description: 'Comma-separated Library names to run (empty for all)'
        type: string
        default: ''
      os:
        description: 'JSON list of runners to run on (empty for Linux, Windows and macOS)'
        type: string
        default: ''
      contents:
        description: 'JSON list of Content names to run, one job each (empty for all)'
        type: string
        default: ''
      layouts:
        description: 'Comma-separated Layout names to run (empty for all)'
        type: string
        default: ''
      jmh:
        description: 'Arguments to org.openjdk.jmh.Main, to run them instead of RunBenchmarks (empty for RunBenchmarks)'
        type: string
        default: ''

jobs:
  benchmarks:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        # One job for each content type, so that each job takes an hour or two rather than most of the job
        # time limit. The libraries are compared within a job, so the jobs need not run on the same machine.
        # The jmh input runs once, on whatever content its arguments name
        content: ${{ fromJSON(inputs.jmh != '' && '["ALL"]' || inputs.contents || '["CLASSES", "TEXT", "BINARY"]') }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Set up JDK
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        # Zulu has no JDK 26 for Windows on aarch64
        distribution: ${{ matrix.os == 'windows-11-arm' && 'liberica' || 'zulu' }}
        java-version: '26'
        cache: 'maven'
    - name: Build the benchmarks
      shell: bash
      run: |
        ./mvnw --no-transfer-progress -B -q -pl classgraph-vfs -am test-compile dependency:build-classpath \
            -DskipTests -Dmdep.includeScope=test -Dmdep.outputFile=target/bench-cp.txt
    - name: Build NetBeans JarFileSystem with the fix from apache/netbeans#9762
      shell: bash
      # Without the fix, NetBeans is not run on text or binary content (see RunBenchmarks). Remove this step once a
      # NetBeans release has the fix, and update the NetBeans dependency instead.
      run: |
        sep=":"
        if [ "$RUNNER_OS" = "Windows" ]; then sep=";"; fi
        mkdir -p target/netbeans-fix/src target/netbeans-fix/classes
        curl -fsSL -o target/netbeans-fix/src/JarFileSystem.java \
            https://raw.githubusercontent.com/lukehutch/netbeans/f30b11315ab2a8ddfadcba2113843ecc81e314a0/platform/openide.filesystems/src/org/openide/filesystems/JarFileSystem.java
        javac --release 21 -nowarn -d target/netbeans-fix/classes \
            -cp "$(cat classgraph-vfs/target/bench-cp.txt)" target/netbeans-fix/src/JarFileSystem.java
        jar cf target/netbeans-fix.jar -C target/netbeans-fix/classes .
    - name: Stop Spotlight indexing
      if: runner.os == 'macOS'
      # Otherwise it indexes the archives the benchmarks generate while the first library is measured
      run: sudo mdutil -a -i off
    - name: Run the benchmarks
      shell: bash
      env:
        QUICK: ${{ inputs.quick }}
        LIBRARIES: ${{ inputs.libraries }}
        CONTENT: ${{ matrix.content }}
        LAYOUTS: ${{ inputs.layouts }}
        JMH: ${{ inputs.jmh }}
      run: |
        sep=":"
        if [ "$RUNNER_OS" = "Windows" ]; then sep=";"; fi
        if [ -n "$JMH" ]; then
          mkdir -p classgraph-vfs/target/bench-results
          # Word splitting of $JMH is wanted: it holds several arguments
          java -cp "target/netbeans-fix.jar${sep}classgraph-vfs/target/test-classes${sep}classgraph-vfs/target/classes${sep}$(cat classgraph-vfs/target/bench-cp.txt)" \
              org.openjdk.jmh.Main $JMH -rf json -rff classgraph-vfs/target/bench-results/jmh.json \
              | tee classgraph-vfs/target/bench-results/jmh.log
          awk '/^Benchmark /,0' classgraph-vfs/target/bench-results/jmh.log \
              | sed 's/^/    /' > classgraph-vfs/target/bench-results/results.md
          exit 0
        fi
        props=("-Dcgvfs.bench.quick=$QUICK")
        if [ -n "$LIBRARIES" ]; then props+=("-Dcgvfs.bench.libraries=$LIBRARIES"); fi
        props+=("-Dcgvfs.bench.contents=$CONTENT")
        if [ -n "$LAYOUTS" ]; then props+=("-Dcgvfs.bench.layouts=$LAYOUTS"); fi
        java "${props[@]}" \
            -cp "target/netbeans-fix.jar${sep}classgraph-vfs/target/test-classes${sep}classgraph-vfs/target/classes${sep}$(cat classgraph-vfs/target/bench-cp.txt)" \
            io.github.classgraph.vfs.perf.RunBenchmarks classgraph-vfs/target/bench-results
    - name: Summarize
      if: always()
      shell: bash
      run: |
        {
          echo "## $RUNNER_OS ($RUNNER_ARCH), $(nproc 2>/dev/null || sysctl -n hw.ncpu) CPUs, ${{ matrix.content }}"
          cat classgraph-vfs/target/bench-results/results.md 2>/dev/null || echo "No results"
        } >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: bench-results-${{ matrix.os }}-${{ matrix.content }}
        path: classgraph-vfs/target/bench-results
