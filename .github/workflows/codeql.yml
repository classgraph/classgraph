name: "CodeQL"

on:
  push:
    branches: [ "latest", "v5" ]
  pull_request:
    branches: [ "latest", "v5" ]
  schedule:
    - cron: "47 11 * * 6"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ java ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java SDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17
          # Autobuild runs the Maven wrapper too -- see the note in ci.yml
          cache: 'maven'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
