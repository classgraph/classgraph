name: Time tests

permissions:
  contents: read

# Times the full test suite on each OS and architecture, to compare the branches. Temporary.
on:
  push:
    branches:
      - time-tests-*

jobs:
  time-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Narcissus has no native library for Windows on aarch64, so its tests fail there; the failures are
        # ignored so that Test 2 runs too
        os: [ windows-11-arm ]
        java: [ '17' ]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Set up JDK
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: ${{ matrix.os == 'windows-11-arm' && 'liberica' || 'zulu' }}
        java-version: ${{ matrix.java }}
        cache: 'maven'
    - name: print Java version
      run: java -version
    - name: Compile
      run: ./mvnw --no-transfer-progress -B clean test-compile
    - name: Test 1
      run: ./mvnw --no-transfer-progress -B test -Dmaven.test.failure.ignore=true
    - name: Test 2
      run: ./mvnw --no-transfer-progress -B test -Dmaven.test.failure.ignore=true
