name: Time tests

permissions:
  contents: read

# Times the full test suite on each OS and architecture, to compare the branches. Temporary.
on:
  push:
    branches:
      - time-tests-*

jobs:
  time-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel ]
        java: [ '17', '25' ]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Set up JDK
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: ${{ matrix.os == 'windows-11-arm' && 'liberica' || 'zulu' }}
        java-version: ${{ matrix.java }}
        cache: 'maven'
    - name: print Java version
      run: java -version
    - name: Install Graphviz
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y graphviz
    - name: Compile
      run: ./mvnw --no-transfer-progress -B clean test-compile
    - name: Test 1
      run: ./mvnw --no-transfer-progress -B test
    - name: Test 2
      run: ./mvnw --no-transfer-progress -B test
